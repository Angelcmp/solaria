name: Release

# Publica binarios precompilados de Linux (x86_64 + aarch64) en cada tag v*.
# Cada Release incluye por arch: tarball (binario + wrapper + icono),
# .deb / .AppImage del bundle Tauri, más un SHA256SUMS.txt conjunto.
# El install.sh descarga estos assets por defecto (instalación en minutos).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential \
            curl wget file xdg-utils unzip patchelf \
            libssl-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev libdbus-1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - run: npm ci

      - name: Build (Tauri release)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Package tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          VER="${GITHUB_REF_NAME#v}"
          STAGE="dist/solaria-${VER}-linux-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          cp "src-tauri/target/release/solaria-agent" "$STAGE/"
          cp "scripts/solaria" "$STAGE/solaria"
          cp "src-tauri/icons/128x128.png" "$STAGE/solaria.png"
          chmod +x "$STAGE/solaria-agent" "$STAGE/solaria"
          echo "$VER" > "$STAGE/VERSION"
          tar -czf "dist/solaria-${VER}-linux-${{ matrix.arch }}.tar.gz" -C dist "solaria-${VER}-linux-${{ matrix.arch }}"
          # Nombres deterministas (sin espacios): el nombre del asset debe
          # coincidir byte a byte con la entrada del SHA256SUMS.
          for d in src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage; do
            [ -d "$d" ] || continue
            ( cd "$d" && for f in *; do
              n="$(echo "$f" | tr ' ' '.')"
              [ "$f" = "$n" ] || mv "$f" "$n"
            done )
          done
          # Directorio plano: el download del job publish lo fusiona tal cual.
          mkdir -p release-assets
          cp dist/*.tar.gz release-assets/
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.tar.gz* release-assets/ 2>/dev/null || true
          ls release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release-assets/*

  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: darwin-*
          merge-multiple: true
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          sha256sum ./*.tar.gz ./*.deb ./*.AppImage ./*.dmg ./*.exe ./*.msi ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: latest.json (updater Tauri)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, re
          from datetime import datetime, timezone
          tag = os.environ['TAG_NAME']
          ver = tag[1:] if tag.startswith('v') else tag
          base = f'https://github.com/Angelcmp/solaria/releases/download/{tag}'
          platforms = {}
          for sig in sorted(glob.glob('dist/*.sig')):
              bundle = sig[:-4]
              if not os.path.isfile(bundle):
                  continue
              with open(sig) as fh:
                  signature = fh.read()
              name = os.path.basename(bundle)
              url = base + '/' + name
              key = None
              low = name.lower()
              if low.endswith('.appimage.tar.gz'):
                  arch = 'x86_64' if ('amd64' in low or 'x86_64' in low) else 'aarch64'
                  key = f'linux-{arch}'
              elif low.endswith('.app.tar.gz'):
                  arch = 'aarch64' if ('aarch64' in low or 'arm64' in low) else 'x86_64'
                  key = f'darwin-{arch}'
              elif 'nsis' in low and low.endswith('.zip'):
                  key = 'windows-x86_64'
              if key and key not in platforms:
                  platforms[key] = {'url': url, 'signature': signature}
          latest = {
              'version': ver,
              'notes': f'Solaria {ver}',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }
          with open('dist/latest.json', 'w') as fh:
              json.dump(latest, fh, indent=2)
          print(json.dumps(latest, indent=2)[:800])
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.sig
            dist/latest.json
            dist/SHA256SUMS.txt

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (Tauri release)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Smoke test (artefacto GUI)
        run: |
          BIN="src-tauri/target/release/solaria-agent"
          [ -x "$BIN" ] || { echo "falta el binario"; exit 1; }
          file "$BIN" | grep -q "Mach-O 64-bit arm64" || { file "$BIN"; exit 1; }
          echo "Mach-O arm64 OK"

      - name: Package tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          VER="${GITHUB_REF_NAME#v}"
          STAGE="dist/solaria-${VER}-darwin-aarch64"
          mkdir -p "$STAGE"
          cp "src-tauri/target/release/solaria-agent" "$STAGE/"
          cp "scripts/solaria" "$STAGE/solaria"
          cp "src-tauri/icons/128x128.png" "$STAGE/solaria.png"
          chmod +x "$STAGE/solaria-agent" "$STAGE/solaria"
          echo "$VER" > "$STAGE/VERSION"
          tar -czf "dist/solaria-${VER}-darwin-aarch64.tar.gz" -C dist "solaria-${VER}-darwin-aarch64"
          for d in src-tauri/target/release/bundle/dmg; do
            [ -d "$d" ] || continue
            ( cd "$d" && for f in *; do
              n="$(echo "$f" | tr ' ' '.')"
              [ "$f" = "$n" ] || mv "$f" "$n"
            done )
          done
          mkdir -p release-assets
          cp dist/*.tar.gz release-assets/
          cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.tar.gz* release-assets/ 2>/dev/null || true
          ls release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-aarch64
          path: release-assets/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (Tauri release)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Smoke test (artefacto GUI)
        shell: pwsh
        run: |
          $bin = '.\src-tauri\target\release\solaria-agent.exe'
          if (-not (Test-Path $bin)) { throw 'falta el binario' }
          if ((Get-Item $bin).Length -lt 1MB) { throw 'binario sospechosamente pequeño' }
          Write-Host 'PE x64 OK'

      - name: Package tarball
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $stage = "dist/solaria-$ver-win-x86_64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'src-tauri\target\release\solaria-agent.exe' $stage
          Copy-Item 'scripts\solaria.ps1' (Join-Path $stage 'solaria.ps1')
          Copy-Item 'src-tauri\icons\128x128.png' (Join-Path $stage 'solaria.png')
          $ver | Out-File (Join-Path $stage 'VERSION') -NoNewline -Encoding ascii
          tar -czf "dist/solaria-$ver-win-x86_64.tar.gz" -C dist "solaria-$ver-win-x86_64"
          foreach ($d in @('src-tauri\target\release\bundle\nsis', 'src-tauri\target\release\bundle\msi')) {
            if (-not (Test-Path $d)) { continue }
            Get-ChildItem $d | Where-Object { $_.Name -match ' ' } | ForEach-Object {
              Rename-Item $_.FullName ($_.Name -replace ' ', '.')
            }
          }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item dist/*.tar.gz release-assets/
          Copy-Item 'src-tauri\target\release\bundle\nsis\*.exe' release-assets/ -ErrorAction SilentlyContinue
          Copy-Item 'src-tauri\target\release\bundle\msi\*.msi' release-assets/ -ErrorAction SilentlyContinue
          Copy-Item 'src-tauri\target\release\bundle\nsis\*.zip*' release-assets/ -ErrorAction SilentlyContinue
          Get-ChildItem release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: release-assets/*
