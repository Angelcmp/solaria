name: Release

# Publica binarios precompilados de Linux (x86_64 + aarch64) en cada tag v*.
# Cada Release incluye por arch: tarball (binario + wrapper + icono),
# .deb / .AppImage del bundle Tauri, más un SHA256SUMS.txt conjunto.
# El install.sh descarga estos assets por defecto (instalación en minutos).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential \
            curl wget file xdg-utils unzip patchelf \
            libssl-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev libdbus-1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - run: npm ci

      - name: Build (Tauri release)
        run: npm run tauri build

      - name: Package tarball
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="dist/solaria-${VER}-linux-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          cp "src-tauri/target/release/solaria-agent" "$STAGE/"
          cp "scripts/solaria" "$STAGE/solaria"
          cp "src-tauri/icons/128x128.png" "$STAGE/solaria.png"
          chmod +x "$STAGE/solaria-agent" "$STAGE/solaria"
          tar -czf "dist/solaria-${VER}-linux-${{ matrix.arch }}.tar.gz" -C dist "solaria-${VER}-linux-${{ matrix.arch }}"
          # Nombres deterministas (sin espacios): el nombre del asset debe
          # coincidir byte a byte con la entrada del SHA256SUMS.
          for d in src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage; do
            [ -d "$d" ] || continue
            ( cd "$d" && for f in *; do
              n="$(echo "$f" | tr ' ' '.')"
              [ "$f" = "$n" ] || mv "$f" "$n"
            done )
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          sha256sum ./*.tar.gz ./*.deb ./*.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
