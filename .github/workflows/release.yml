name: Release

# Publica binarios precompilados de Linux x86_64 en cada tag v*.
# Cada Release incluye: tarball (binario + wrapper + icono),
# .deb / .AppImage del bundle Tauri y SHA256SUMS.txt.
# El install.sh descarga estos assets por defecto (instalación en minutos).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential \
            curl wget file xdg-utils patchelf \
            libssl-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev libdbus-1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - run: npm ci

      - name: Build (Tauri release)
        run: npm run tauri build

      - name: Package tarball + checksums
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="dist/solaria-${VER}-linux-x86_64"
          mkdir -p "$STAGE"
          cp "src-tauri/target/release/solaria-agent" "$STAGE/"
          cp "scripts/solaria" "$STAGE/solaria"
          cp "src-tauri/icons/128x128.png" "$STAGE/solaria.png"
          chmod +x "$STAGE/solaria-agent" "$STAGE/solaria"
          tar -czf "dist/solaria-${VER}-linux-x86_64.tar.gz" -C dist "solaria-${VER}-linux-x86_64"
          ( cd dist && sha256sum "solaria-${VER}-linux-x86_64.tar.gz" > SHA256SUMS.txt )
          ( cd src-tauri/target/release/bundle && find deb appimage -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec sha256sum {} + >> "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt" )
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
